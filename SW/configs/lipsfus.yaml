general:
  name: LIPSFUS_SpokenDigits
  data_dir: /home/lsriw/Datasets/LIPSFUS_dataset/QuietRoom/SpokenDigits_only_audio

  time_window: 700_000 # 1 second
  num_channels: 128 # number of frequency channels

preprocess:
  create_val: False
  val_split: 0.1

graph:
  time_radius: 1000
  channel_radius: 5
  skip_channels: 1
  features: global # local, global or None

train:
  batch_size: 4
  num_workers: 4
  num_epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  use_scheduler: False

model:
  num_classes: 10
  conv_channels: [64, 64, 64, 64]
  conv_bits: [16, 8, 8, 8]

  linear_channels: 512
  global_pooling: mean # mean, max or add



